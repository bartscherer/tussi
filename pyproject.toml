[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tussi"
version = "3.0.0"
description = "TUS 1.0.0 resumable upload server - ASGI middleware with filesystem storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Bartscherer", email = "thomas@bartscherer.io" }]
keywords = ["tus", "upload", "resumable", "asgi", "async", "filesystem"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["anyio>=4.0", "pydantic>=2.0", "starlette>=0.27"]

[project.optional-dependencies]
test = [
    "anyio[trio]>=4.0",
    "httpx>=0.24",
    "pytest>=8",
    "pytest-asyncio>=0.23"
]
cli = [
    "fastapi>=0.100",
    "requests>=2.28",
    "rich>=13",
    "uvicorn>=0.20"
]

[project.scripts]
tussi-upload = "tussi._demo_upload:main"
tussi-server = "tussi._demo_server:main"

[project.urls]
Homepage = "https://github.com/bartscherer/tussi"
Repository = "https://github.com/bartscherer/tussi"
Issues = "https://github.com/bartscherer/tussi/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.package-data]
tussi = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tussi*"]
